<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIA — Admin</title>
<style>
  :root{--bg:#f7f7fb;--card:#fff;--ink:#1d1d26;--mute:#777;--acc:#5b4bdb;--ok:#1a9d5a;--bad:#d33;--line:#e4e4ee}
  @media (prefers-color-scheme:dark){:root{--bg:#14141b;--card:#1d1d27;--ink:#eee;--mute:#999;--acc:#8c7dff;--ok:#41c98a;--bad:#ff6b6b;--line:#2c2c3a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:16px}
  h1{font-size:20px;margin:0 0 12px} h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .big{font-size:26px;font-weight:700}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse} td{padding:3px 0;border-bottom:1px solid var(--line);font-size:14px} td:last-child{text-align:right}
  button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff;cursor:pointer}
  input,textarea{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  textarea{min-height:70px} .row{display:flex;gap:8px;margin:8px 0} .hide{display:none!important}
  pre{white-space:pre-wrap;margin:8px 0 0}
  svg{width:100%;height:70px}
</style>
</head>
<body>
<div id="login" class="card" style="max-width:340px;margin:60px auto">
  <h1>RIA admin</h1>
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
  <div class="row"><button id="loginBtn">Login</button></div>
  <div id="lerr" class="bad"></div>
</div>

<div id="app" class="hide">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h1>RIA dashboard</h1>
    <span><button id="refresh">Refresh</button> <button id="out" style="background:var(--mute)">Logout</button></span>
  </div>
  <div class="grid">
    <div class="card"><h2>VPS</h2><div id="vps" class="big">…</div><table id="vpsT"></table></div>
    <div class="card"><h2>Model / provider</h2><table id="modelT"></table></div>
    <div class="card"><h2>Queue</h2><table id="queueT"></table></div>
    <div class="card"><h2>Requests &amp; errors</h2><table id="reqT"></table></div>
    <div class="card"><h2>Inference latency (VPS)</h2><table id="latT"></table></div>
    <div class="card"><h2>Space → VPS calls (last 60)</h2><svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"></svg><table id="spaceT"></table></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h2>AI playground (stateless — nothing is stored)</h2>
    <textarea id="pgSys" placeholder="Optional system prompt (leave empty to use RIA's persona)"></textarea>
    <textarea id="pgMsg" placeholder="Message to test, e.g. Hi / Mood off hai / Miss you"></textarea>
    <div class="row"><input id="pgT" type="number" step="0.05" min="0" max="1.5" placeholder="temperature (0.75)"><input id="pgN" type="number" min="16" max="500" placeholder="max tokens"></div>
    <button id="pgGo">Run</button>
    <pre id="pgOut"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = async (m, p, body) => {
  const r = await fetch(p, {method: m, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  let d = {}; try { d = await r.json(); } catch {}
  return {status: r.status, data: d};
};
function table(el, rows){
  el.textContent = '';
  for (const [k, v] of rows){
    const tr = el.insertRow(); tr.insertCell().textContent = k;
    const c = tr.insertCell(); c.textContent = (v === null || v === undefined) ? '—' : String(v);
  }
}
function spark(points){
  const svg = $('spark'); svg.textContent = '';
  if (!points.length) return;
  const max = Math.max(...points.map(p => p.ms), 1), w = 300 / Math.max(points.length - 1, 1);
  const NS = 'http://www.w3.org/2000/svg';
  const pl = document.createElementNS(NS, 'polyline');
  pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', 'currentColor'); pl.setAttribute('stroke-width', '2');
  pl.setAttribute('points', points.map((p, i) => `${i * w},${68 - (p.ms / max) * 64}`).join(' '));
  svg.appendChild(pl);
}
async function load(){
  const {status, data} = await api('GET', '/admin/api/overview');
  if (status === 401) { $('app').classList.add('hide'); $('login').classList.remove('hide'); return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  const st = data.status || {}, h = data.health || {}, stats = data.stats || {}, m = data.model || {}, sp = data.space || {};
  const up = h.status === 'ok';
  $('vps').textContent = h.status ? h.status.toUpperCase() : 'UNREACHABLE';
  $('vps').className = 'big ' + (up ? 'ok' : 'bad');
  table($('vpsT'), [['Ollama', st.ollama], ['MongoDB', st.mongo], ['Telegram polling', st.telegram_polling], ['Uptime (s)', st.uptime_seconds], ['Users', stats.users], ['Stored messages', stats.stored_messages], ['Memories', stats.stored_memories]]);
  const p = m.primary || {};
  table($('modelT'), [['Primary', `${p.provider || ''} ${p.model || ''}`], ['Installed', p.model_installed], ['AI mode', m.ai_mode], ['HF replica', JSON.stringify(m.hf_replica || {})], ['OpenRouter', JSON.stringify(m.openrouter || {})], ['Served by', JSON.stringify(stats.served_by || {})]]);
  const q = stats.queue || {};
  table($('queueT'), [['Waiting', q.queued], ['Running', q.active], ['Concurrency', q.concurrency], ['Rejected', q.rejected], ['Timed out', q.timed_out], ['Avg wait (ms)', q.avg_wait_ms]]);
  const r = stats.requests || {};
  table($('reqT'), [['Messages', r.messages], ['OK', r.ok], ['Errors', r.errors], ['Busy rejects', r.busy], ['Injection attempts', r.injection_attempts], ['Telegram / Web', r.by_channel ? `${r.by_channel.telegram} / ${r.by_channel.web}` : null]]);
  const l = stats.latency || {};
  table($('latT'), [['Samples', l.count], ['Average (ms)', l.avg_ms], ['p95 (ms)', l.p95_ms], ['Provider errors', JSON.stringify(stats.provider_errors || {})]]);
  table($('spaceT'), [['Calls / hour', sp.requests_last_hour], ['Errors / hour', sp.errors_last_hour], ['Avg (ms)', sp.avg_latency_ms], ['p95 (ms)', sp.p95_latency_ms]]);
  spark(sp.series || []);
}
$('loginBtn').onclick = async () => {
  const {status} = await api('POST', '/admin/api/login', {password: $('pw').value});
  $('pw').value = ''; $('lerr').textContent = status === 200 ? '' : 'Login failed';
  if (status === 200) load();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('refresh').onclick = load;
$('out').onclick = async () => { await api('POST', '/admin/api/logout'); load(); };
$('pgGo').onclick = async () => {
  $('pgOut').textContent = '…';
  const body = {message: $('pgMsg').value};
  if ($('pgSys').value.trim()) body.system = $('pgSys').value;
  if ($('pgT').value) body.temperature = parseFloat($('pgT').value);
  if ($('pgN').value) body.max_tokens = parseInt($('pgN').value, 10);
  const {status, data} = await api('POST', '/admin/api/playground', body);
  $('pgOut').textContent = status === 200 ? `${data.reply}\n\n— ${data.provider}/${data.model} · ${data.latency_ms} ms · ${data.completion_tokens} tokens` : (data.detail || 'error');
};
load(); setInterval(() => { if (!$('app').classList.contains('hide')) load(); }, 30000);
</script>
</body>
</html>
