# Deploys ONLY the hf_space/ folder to the Hugging Face Space "ria-ai-companion".
# VPS credentials are never used or stored in GitHub: the VPS is updated manually via Termius.
#
# GitHub -> Settings -> Secrets and variables -> Actions:
#   Secret   HF_TOKEN     Hugging Face access token with WRITE access (fine-grained: only this Space)
#   Variable HF_USERNAME  your Hugging Face username (or org)
name: Deploy Hugging Face Space
on:
  push:
    branches: [main]
    paths: ["hf_space/**"]
  workflow_dispatch:
concurrency: deploy-hf
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Push hf_space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          set -euo pipefail
          : "${HF_TOKEN:?HF_TOKEN secret missing}" "${HF_USERNAME:?HF_USERNAME variable missing}"
          git clone --depth 1 "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/ria-ai-companion" space
          rsync -a --delete --exclude '.git' --exclude '.env*' --exclude 'Dockerfile.replica' --exclude 'start_replica.sh' hf_space/ space/
          cd space
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push
