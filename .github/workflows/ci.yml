name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app hf_space
      - run: pytest -q
      - run: bash -n scripts/install.sh scripts/update.sh scripts/backup.sh scripts/healthcheck.sh
