# HTTPS reverse proxy for the RIA API (use ONLY if ports 80/443 are free).
# IMPORTANT: your VPS already runs "tg-game-caddy-1", which probably owns 80/443.
# Check first:   sudo ss -tlnp | grep -E ':(80|443)\s'
# If Caddy owns them, use deploy/Caddyfile.snippet instead of nginx.
#
# Setup (nginx):
#   1. Create DNS A record  ria-api.example.com -> your VPS IP
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/ria-api && edit the domain
#   3. sudo ln -s /etc/nginx/sites-available/ria-api /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d ria-api.example.com
#   5. sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=ria_api:10m rate=10r/s;

server {
    listen 80;
    server_name ria-api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ria-api.example.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/ria-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ria-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Only the API path is proxied; everything else is 404.
    location /api/v1/ {
        limit_req zone=ria_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never forward) client-supplied values
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # CPU inference can take a while
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
