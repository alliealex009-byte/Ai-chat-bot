# RIA's own MongoDB. Separate container, network, volume and port from your sticker bot's Mongo.
# Run from the repo root:
#   docker compose -p ria --env-file .env -f deploy/docker-compose.yml up -d
name: ria

services:
  ria-mongo:
    image: mongo:7
    container_name: ria-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ria_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-ria_database}
    ports:
      # localhost only — never reachable from the internet or Hugging Face
      - "127.0.0.1:27018:27017"
    volumes:
      - ria_mongo_data:/data/db
    networks:
      - ria_net
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ria_mongo_data:
    name: ria_mongo_data

networks:
  ria_net:
    name: ria_net
